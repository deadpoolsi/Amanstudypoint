<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register — Aman Study Point</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .login-card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    max-width: 400px;
    width: 100%;
    padding: 30px 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }
  .login-logo {
    font-size: 1.35rem;
    font-weight: 800;
    color: #e8590c;
    text-align: center;
    text-decoration: none;
    display: block;
    margin-bottom: 4px;
  }
  .login-sub {
    text-align: center;
    color: #666;
    font-size: 0.88rem;
    margin-bottom: 22px;
  }
  .tabs {
    display: flex;
    background: #f1f3f5;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    color: #666;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  .tab.active {
    background: #ffffff;
    color: #e8590c;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 0.86rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ced4da;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
  }
  .field input:focus {
    border-color: #e8590c;
    box-shadow: 0 0 0 3px rgba(232, 89, 12, 0.15);
  }
  .btn-submit {
    width: 100%;
    background: #e8590c;
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: 0.2s;
  }
  .btn-submit:hover {
    background: #d9480f;
  }
  .btn-ghost {
    width: 100%;
    background: #f8f9fa;
    border: 1.5px solid #dee2e6;
    color: #333;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 0.82rem;
    color: #e8590c;
    font-weight: 600;
    margin-top: -6px;
    margin-bottom: 18px;
    cursor: pointer;
    text-decoration: none;
  }
  .back-home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #888;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .back-home:hover {
    color: #e8590c;
  }
  .error-msg {
    background: #ffe3e3;
    color: #c92a2a;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="login-card">
  <a class="login-logo" href="index.html">📘 AMAN STUDY POINT</a>
  <div class="login-sub" id="formSubtitle">Log in to your account or create a new one</div>

  <!-- Switcher Tabs -->
  <div class="tabs" id="authTabs">
    <button class="tab active" id="tabLogin" type="button" onclick="switchTab('login')">Login</button>
    <button class="tab" id="tabReg" type="button" onclick="switchTab('reg')">New Account</button>
  </div>

  <div id="loginError" class="error-msg"></div>

  <!-- Google Login Button -->
  <button type="button" class="btn-ghost" onclick="loginWithGoogle()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid #ced4da; padding: 10px; font-weight: 600; margin-bottom: 12px; background: #fff;">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 18px; height: 18px;"> Continue with Google
  </button>

  <div style="text-align: center; margin-bottom: 14px;">
    <span style="color: #888; font-size: 0.85rem;">— ਜਾਂ (OR) —</span>
  </div>

  <!-- 1. Login Form -->
  <form id="formLogin" onsubmit="event.preventDefault(); handleLogin();">
    <div class="field">
      <label>📱 Mobile Number</label>
      <input type="tel" id="loginPhone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
    </div>
    <div class="field">
      <label>🔒 Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" required>
    </div>
    <div class="forgot-link" onclick="showForgotForm()">Forgot Password? (ਪਾਸਵਰਡ ਭੁੱਲ ਗਏ?)</div>
    <button type="submit" class="btn-submit">➔ Login</button>
  </form>

  <!-- 2. Register Form (100% Validated) -->
  <form id="formReg" style="display:none;" onsubmit="event.preventDefault(); handleRegister();">
    <div class="field">
      <label>👤 Full Name (ਵਿਦਿਆਰਥੀ ਦਾ ਪੂਰਾ ਨਾਮ)</label>
      <input type="text" id="regName" placeholder="Enter your full name" minlength="3" required>
    </div>
    <div class="field">
      <label>📱 Mobile Number (ਸਿਰਫ਼ 10 ਅੰਕਾਂ ਦਾ ਨੰਬਰ)</label>
      <input type="tel" id="regPhone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
    </div>
    <div class="field">
      <label>🔒 Set Password (ਪਾਸਵਰਡ ਬਣਾਓ)</label>
      <input type="password" id="regPass" placeholder="Choose password (min 4 chars)" minlength="4" required>
    </div>
    <button type="submit" class="btn-submit">🎉 Create Account</button>
  </form>

  <!-- 3. Forgot Password Form -->
  <div id="formForgot" style="display:none;">
    <p style="color:#555; font-size:0.88rem; margin-bottom:14px; line-height:1.4;">
      ਆਪਣਾ ਰਜਿਸਟਰਡ 10 ਅੰਕਾਂ ਦਾ ਮੋਬਾਈਲ ਨੰਬਰ ਭਰੋ, ਤੁਹਾਡਾ ਪਾਸਵਰਡ ਵਟਸਐਪ 'ਤੇ ਭੇਜ ਦਿੱਤਾ ਜਾਵੇਗਾ:
    </p>
    <div class="field">
      <label>📱 Registered Mobile Number</label>
      <input type="tel" id="forgotPhone" placeholder="10-digit registered number" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
      <button class="btn-submit" type="button" onclick="sendForgotWhatsApp()">📲 Get Password on WhatsApp</button>
      <button class="btn-ghost" type="button" onclick="cancelForgot()">Cancel</button>
    </div>
  </div>

  <a class="back-home" href="index.html">← Back to Home</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>

<script>
// --- 🔄 SWITCH TABS (Login / Register) ---
function switchTab(type) {
  hideError();
  document.getElementById("formForgot").style.display = "none";
  if (type === 'login') {
    document.getElementById("tabLogin").classList.add("active");
    document.getElementById("tabReg").classList.remove("active");
    document.getElementById("formLogin").style.display = "block";
    document.getElementById("formReg").style.display = "none";
    document.getElementById("formSubtitle").textContent = "Log in to your account";
  } else {
    document.getElementById("tabReg").classList.add("active");
    document.getElementById("tabLogin").classList.remove("active");
    document.getElementById("formReg").style.display = "block";
    document.getElementById("formLogin").style.display = "none";
    document.getElementById("formSubtitle").textContent = "Create a new student account";
  }
}

function showError(msg) {
  const err = document.getElementById("loginError");
  err.textContent = msg;
  err.style.display = "block";
}

function hideError() {
  document.getElementById("loginError").style.display = "none";
}

// 🔒 ਪਾਸਵਰਡ ਨੂੰ ਸੁਰੱਖਿਅਤ ਕੋਡ (Hash) ਵਿੱਚ ਬਦਲਣ ਵਾਲਾ ਫੰਕਸ਼ਨ
async function hashPassword(plainText) {
  const msgUint8 = new TextEncoder().encode(plainText);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// --- 📝 SAFE REGISTRATION WITH HASHED PASSWORD ---
async function handleRegister() {
  hideError();
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const pass = document.getElementById("regPass").value.trim();

  if (name.length < 3) {
    showError("⚠️ ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਪੂਰਾ ਨਾਮ ਭਰੋ (ਘੱਟੋ-ਘੱਟ 3 ਅੱਖਰ)।");
    return;
  }
  const phoneRegex = /^[6-9]\d{9}$/;
  if (!phoneRegex.test(phone)) {
    showError("⚠️ ਕਿਰਪਾ ਕਰਕੇ ਸਹੀ 10 ਅੰਕਾਂ ਵਾਲਾ ਮੋਬਾਈਲ ਨੰਬਰ ਭਰੋ।");
    return;
  }
  if (!pass || pass.length < 4) {
    showError("⚠️ ਪਾਸਵਰਡ ਘੱਟੋ-ਘੱਟ 4 ਅੱਖਰਾਂ ਜਾਂ ਅੰਕਾਂ ਦਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।");
    return;
  }

  const securePassword = await hashPassword(pass);

  db.ref("accounts/" + phone).once("value", snap => {
    if (snap.exists()) {
      showError("⚠️ ਇਹ ਮੋਬਾਈਲ ਨੰਬਰ ਪਹਿਲਾਂ ਹੀ ਰਜਿਸਟਰ ਹੈ। Login ਕਰੋ!");
      return;
    }

    const userData = {
      name: name,
      phone: phone,
      password: securePassword,
      createdAt: new Date().toLocaleString(),
      authType: "phone"
    };

    db.ref("accounts/" + phone).set(userData);
    db.ref("users/" + phone).update({ name: name, phone: phone });

    localStorage.setItem("pp_session", phone);
    localStorage.setItem("pp_name", name);
    alert("🎉 ਖਾਤਾ ਸਫਲਤਾਪੂਰਵਕ ਬਣ ਗਿਆ ਹੈ!");
    window.location.href = "index.html";
  });
}

// --- 🔐 SAFE LOGIN WITH HASH CHECK ---
async function handleLogin() {
  hideError();
  const phone = document.getElementById("loginPhone").value.trim();
  const pass = document.getElementById("loginPass").value.trim();

  if (phone.length !== 10) {
    showError("⚠️ ਕਿਰਪਾ ਕਰਕੇ 10 ਅੰਕਾਂ ਦਾ ਮੋਬਾਈਲ ਨੰਬਰ ਭਰੋ।");
    return;
  }

  const enteredHash = await hashPassword(pass);

  db.ref("accounts/" + phone).once("value", snap => {
    const acc = snap.val();
    if (!acc) {
      showError("⚠️ ਇਹ ਮੋਬਾਈਲ ਨੰਬਰ ਰਜਿਸਟਰ ਨਹੀਂ ਹੈ!");
      return;
    }

    // ਨਵਾਂ ਇਨਕ੍ਰਿਪਟਿਡ ਜਾਂ ਪੁਰਾਣਾ ਪਾਸਵਰਡ ਦੋਵੇਂ ਚੈੱਕ ਹੋਣਗੇ
    if (acc.password === enteredHash || acc.password === pass || acc.pass === pass) {
      localStorage.setItem("pp_session", phone);
      localStorage.setItem("pp_name", acc.name || "Student");
      alert("✅ ਲੌਗਇਨ ਸਫਲ ਰਿਹਾ!");
      window.location.href = "index.html";
    } else {
      showError("⚠️ ਪਾਸਵਰਡ ਗ਼ਲਤ ਹੈ! ਕਿਰਪਾ ਕਰਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।");
    }
  });
}

// --- 🌐 GOOGLE LOGIN ---
function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider)
    .then((result) => {
      const user = result.user;
      const name = user.displayName || "Student";
      const identifier = user.phoneNumber || user.email.replace(/[^a-zA-Z0-9]/g, "_");

      db.ref("accounts/" + identifier).update({
        name: name,
        phone: identifier,
        email: user.email,
        authType: "google",
        password: "GOOGLE_AUTH"
      }).then(() => {
        db.ref("users/" + identifier).update({ name: name, phone: identifier });
        localStorage.setItem("pp_session", identifier);
        localStorage.setItem("pp_name", name);
        alert("✅ ਲੌਗਇਨ ਸਫਲ ਰਿਹਾ!");
        window.location.href = "index.html";
      });
    })
    .catch((error) => {
      alert("Google Login Error: " + error.message);
    });
}

// --- 📲 FORGOT PASSWORD ---
function showForgotForm() {
  document.getElementById("formLogin").style.display = "none";
  document.getElementById("formReg").style.display = "none";
  document.getElementById("formForgot").style.display = "block";
  document.getElementById("authTabs").style.display = "none";
}

function cancelForgot() {
  document.getElementById("authTabs").style.display = "flex";
  switchTab('login');
}

function sendForgotWhatsApp() {
  const phone = document.getElementById("forgotPhone").value.trim();
  if (phone.length !== 10) {
    alert("⚠️ ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ 10 ਅੰਕਾਂ ਦਾ ਰਜਿਸਟਰਡ ਨੰਬਰ ਭਰੋ।");
    return;
  }

  db.ref("accounts/" + phone).once("value", snap => {
    const acc = snap.val();
    if (!acc) {
      alert("⚠️ ਇਹ ਨੰਬਰ ਰਜਿਸਟਰ ਨਹੀਂ ਹੈ!");
      return;
    }

    const pass = acc.password || "No password set";
    const msg = encodeURIComponent(`Hello Sir,\nI forgot my password for Aman Study Point.\nName: ${acc.name}\nRegistered Phone: ${phone}\nPlease send my password.`);
    window.open(`https://api.whatsapp.com/send?phone=919041321843&text=${msg}`, "_blank");
  });
}

// 🔒 ਪਾਸਵਰਡ ਨੂੰ ਸਕਿਓਰ ਕੋਡ (Hash) ਵਿੱਚ ਬਦਲਣ ਵਾਲਾ ਫੰਕਸ਼ਨ
async function hashPassword(plainText) {
  const msgUint8 = new TextEncoder().encode(plainText);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

</script>
</body>
</html>
