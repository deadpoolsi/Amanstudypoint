<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>💳 ਭੁਗਤਾਨ — Aman Study Point</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(160deg, #e8590c, #c92a0d); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #fff; border-radius: 18px; max-width: 400px; width: 100%; padding: 26px 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .logo { font-size: 2.2rem; }
  h1 { font-size: 1.25rem; color: #222; margin: 6px 0 2px; }
  .amt { font-size: 2.6rem; font-weight: 800; color: #2b8a3e; margin: 10px 0 2px; }
  .sub { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
  .paybtn { width: 100%; padding: 15px; background: #e8590c; color: #fff; font-size: 1.05rem; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(232,89,12,0.4); }
  .paybtn:active { transform: scale(0.98); }
  .note { margin-top: 14px; color: #777; font-size: 0.8rem; line-height: 1.6; }
  .big { font-size: 3.4rem; }
  .ok { color: #2b8a3e; font-weight: 800; }
  .bad { color: #c92a2a; font-weight: 800; }
  .retry { margin-top: 14px; background: #1971c2; color: #fff; border: none; padding: 11px 22px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div id="ph">
      <div class="logo">🎓</div>
      <h1>Aman Study Point</h1>
      <div style="color:#888; font-size:0.9rem;">ਭੁਗਤਾਨ ਪੰਨਾ (Secure Payment)</div>
      <div style="margin:20px 0;"><div style="font-size:2rem;">⏳</div><div style="color:#888; font-weight:700; margin-top:6px;">ਲੋਡ ਹੋ ਰਿਹਆ ਹੈ...</div></div>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════
   📷 QR PAYMENT PAGE — "kise vi phone ton payment" layi
   ------------------------------------------------------------
   Vidiarathi de phone te QR disda hai → eh page khulda hai
   (scan karne wale kehre vi phone ton, maa-pya de vi) →
   Razorpay checkout → payment → SERVER verify (HMAC signature,
   amount match, order-to-user binding) → pass/book apne aap
   ACTIVE → vidiarathi de phone te "🎉 ਭੁਗਤਾਨ ਸਫ਼ਲ" apne aap.
   🔒 Eh page koi sensitive data nahi rakhta — sirf order_id +
   public key. Sage verify SERVER karda hai (api/verify-payment).
   ═══════════════════════════════════════════════════════════ */
(function () {
  var ph = document.getElementById("ph");
  var q = new URLSearchParams(location.search);
  var orderId = q.get("order") || "";
  var keyId = q.get("key") || "";
  var amountP = parseInt(q.get("amount") || "0", 10) || 0;
  var rupees = Math.round(amountP / 100);
  var lastResp = null; // retry verify layi

  if (!orderId || !keyId) {
    ph.innerHTML = '<div class="big">⚠️</div><h1>ਗ਼ਲਤ ਲਿੰਕ ਹੈ</h1><div class="note">ਕਿਰਪਾ ਕਰਕੇ ਦੁਬਾਰਾ QR ਸਕੈਨ ਕਰੋ ਜੀ।</div>';
    return;
  }

  ph.innerHTML =
    '<div class="logo">🎓</div>' +
    '<h1>Aman Study Point</h1>' +
    '<div style="color:#888; font-size:0.9rem;">ਭੁਗਤਾਨ ਪੰਨਾ (Secure Payment)</div>' +
    '<div class="amt">₹' + rupees + '</div>' +
    '<div class="sub">ਹੇਠਾਂ ਦੱਬ ਕੇ UPI / ਕਾਰਡ / NetBanking ਨਾਲ ਭੁਗਤਾਨ ਕਰੋ</div>' +
    '<button class="paybtn" id="goPay">⚡ ₹' + rupees + ' ਭੁਗਤਾਨ ਕਰੋ</button>' +
    '<div class="note">🔒 ਇਹ ਭੁਗਤਾਨ <b>Razorpay</b> ਰਾਹੀਂ 100% ਸੁਰੱਖਿਅਤ ਹੈ।<br>ਭੁਗਤਾਨ ਹੁੰਦੇ ਹੀ ਵਿਦਿਆਰਥੀ ਦਾ pass/ਕਿਤਾਬ <b>ਆਪਣੇ-ਆਪ</b> active ਹੋ ਜਾਵੇਗੀ।</div>';

  function showWaiting() {
    ph.innerHTML = '<div class="logo">🎓</div><h1>Aman Study Point</h1>' +
      '<div style="margin:24px 0;"><div style="font-size:2.2rem;">⏳</div>' +
      '<div style="color:#555; font-weight:700; margin-top:8px;">ਭੁਗਤਾਨ ਦੀ ਪੁਸ਼ਟੀ ਹੋ ਰਹੀ ਹੈ...</div>' +
      '<div class="note">ਇਹ ਪੰਨਾ ਬੰਦ ਨਾ ਕਰੋ ਜੀ</div></div>';
  }

  function showSuccess(msg) {
    ph.innerHTML = '<div class="big">🎉</div><h1 class="ok">ਭੁਗਤਾਨ ਸਫ਼ਲ!</h1>' +
      '<p style="color:#555; margin:10px 0; font-weight:700; line-height:1.6;">' + (msg || "ਵਿਦਿਆਰਥੀ ਦਾ pass/ਕਿਤਾਬ ਹੁਣੇ active ਹੋ ਗਿਆ ਹੈ ✅") + '</p>' +
      '<div class="note">ਹੁਣ ਇਹ ਪੰਨਾ ਬੰਦ ਕਰ ਸਕਦੇ ਹੋ।<br>ਵਿਦਿਆਰਥੀ ਦੇ ਫ਼ੋਨ ਉੱਤੇ ਵੀ "🎉 ਭੁਗਤਾਨ ਸਫ਼ਲ" ਆਪਣੇ-ਆਪ ਦਿਖ ਜਾਵੇਗਾ।</div>';
  }

  function showError(msg) {
    ph.innerHTML = '<div class="big">⚠️</div><h1 class="bad">ਭੁਗਤਾਨ ਪੁਸ਼ਟੀ ਫੇਲ੍ਹ ਹੋਈ</h1>' +
      '<p style="color:#555; margin:10px 0; font-size:0.9rem;">' + msg + '</p>' +
      (lastResp ? '<button class="retry" onclick="location.reload()">🔄 ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ</button>' : '') +
      '<div class="note">ਮਦਦ ਲਈ Aman Study Point ਨਾਲ ਸੰਪਰਕ ਕਰੋ।</div>';
  }

  async function verifyNow(resp) {
    lastResp = resp;
    showWaiting();
    try {
      var r = await fetch("/api/verify-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          razorpay_payment_id: resp.razorpay_payment_id,
          razorpay_order_id: resp.razorpay_order_id,
          razorpay_signature: resp.razorpay_signature
          /* 🔒 phone nahin bhejda — server ORDER NOTES ton hi asli vidiarathi
             labhda hai (token-bound) — koi dhokha namumkin */
        })
      });
      var d = await r.json();
      if (d && d.success) { showSuccess(d.message); }
      else { showError((d && d.message) || "ਅਣਜਾਣ ਗ਼ਲਤੀ"); }
    } catch (e) {
      showError("ਇੰਟਰਨੈੱਟ ਸਮੱਸਿਆ — ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ");
    }
  }

  document.getElementById("goPay").onclick = function () {
    var options = {
      key: keyId,
      order_id: orderId,
      currency: "INR",
      name: "Aman Study Point",
      description: "Pass / Book Payment",
      theme: { color: "#e8590c" },
      handler: function (response) { verifyNow(response); },
      modal: {
        ondismiss: function () {
          ph.innerHTML = '<div class="big">🙏</div><h1>ਭੁਗਤਾਨ ਅਧੂਰਾ ਰਿਹਾ</h1>' +
            '<p style="color:#555; margin:10px 0;">ਕੋਈ ਗੱਲ ਨਹੀਂ — ਹੇਠਾਂ ਦੱਬ ਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।</p>' +
            '<button class="retry" onclick="location.reload()">🔄 ਦੁਬਾਰਾ ਭੁਗਤਾਨ</button>';
        }
      }
    };
    if (amountP > 0) options.amount = amountP;
    try {
      new Razorpay(options).open();
    } catch (e) {
      showError("Razorpay ਲੋਡ ਨਹੀਂ ਹੋਇਆ — ਇੰਟਰਨੈੱਟ ਚੈੱਕ ਕਰੋ");
    }
  };
})();
</script>
</body>
</html>
