<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>🔑 Admin Password Reset — Aman Study Point</title>
  <meta name="theme-color" content="#e8590c">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #212529; font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 28px 22px; max-width: 420px; width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }
    .card h1 { font-size: 1.25rem; margin: 0 0 4px; color: #e8590c; text-align: center; }
    .card .sub { text-align: center; color: #868e96; font-size: 0.82rem; margin: 0 0 18px; }
    label { display: block; font-size: 0.82rem; font-weight: bold; color: #495057; margin: 12px 0 4px; }
    input {
      width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 10px;
      font-size: 1rem; outline: none; background: #f8f9fa;
    }
    input:focus { border-color: #e8590c; background: #fff; }
    button {
      width: 100%; margin-top: 18px; padding: 13px; background: #e8590c; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    button:disabled { background: #adb5bd; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 0.88rem; display: none; }
    .msg.ok { background: #ebfbee; color: #2b8a3e; display: block; }
    .msg.err { background: #ffe3e3; color: #c92a2a; display: block; }
    .admin-box { background: #fff4e6; border-radius: 10px; padding: 14px; margin-bottom: 6px; }
    .admin-box p { margin: 4px 0; font-size: 0.85rem; color: #495057; }
    .hidden { display: none; }
    .hint { font-size: 0.75rem; color: #adb5bd; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Admin Password Reset</h1>
    <p class="sub">ਵਿਦਿਆਰਥੀ ਦਾ password ਭੁੱਲ ਗਿਆ? ਇੱਥੋਂ 10 ਸਕਿੰਟ ਵਿੱਚ ਬਦਲੋ</p>

    <!-- STEP 1: Admin login -->
    <div id="loginBox">
      <div class="admin-box">
        <p><b>👑 Admin Login</b> (deadpool73503@gmail.com)</p>
      </div>
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="deadpool73503@gmail.com" autocomplete="username">
      <label>Admin Password</label>
      <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password">
      <button id="adminLoginBtn" onclick="adminLogin()">👑 Admin Login ਕਰੋ</button>
    </div>

    <!-- STEP 2: Reset form -->
    <div id="resetBox" class="hidden">
      <div class="admin-box">
        <p>✅ <b id="whoAmI"></b> ਵਜੋਂ login ਹੈ</p>
      </div>
      <label>📱 ਵਿਦਿਆਰਥੀ ਦਾ Mobile Number</label>
      <input type="tel" id="stuPhone" placeholder="9876543210" maxlength="10" inputmode="numeric">
      <label>🔑 ਨਵਾਂ Password (6+ ਅੱਖਰ)</label>
      <input type="text" id="stuNewPass" placeholder="nava-password">
      <button id="resetBtn" onclick="doReset()">🔄 Password Reset ਕਰੋ</button>
      <button style="background:#f1f3f5; color:#495057; margin-top:8px;" onclick="location.reload()">↩️ Admin ਬਦਲੋ</button>
    </div>

    <div id="msgBox" class="msg"></div>
    <p class="hint">⚠️ ਸਿਰਫ਼ Admin ਵਰਤ ਸਕਦਾ ਹੈ — ਹਰ attempt server ਤੇ verify ਹੁੰਦਾ ਹੈ</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const ADMIN_EMAIL = "deadpool73503@gmail.com";

    firebase.initializeApp({
      apiKey: "AIzaSyDHKhXcfzOPHBYzkn1CXuz2tw0Iix1EzMw",
      authDomain: "aman-study-point.firebaseapp.com",
      databaseURL: "https://aman-study-point-default-rtdb.firebaseio.com",
      projectId: "aman-study-point",
      storageBucket: "aman-study-point.firebasestorage.app",
      messagingSenderId: "1059866846804",
      appId: "1:1059866846804:web:1a9b4b58377b815b79afc1"
    });
    const auth = firebase.auth();

    const msgBox = document.getElementById("msgBox");
    function showMsg(text, ok) {
      msgBox.textContent = text;
      msgBox.className = "msg " + (ok ? "ok" : "err");
    }
    function busy(btn, on, label) {
      btn.disabled = on;
      btn.textContent = on ? "⏳ ਉਡੀਕ ਕਰੋ..." : label;
    }

    /* Pehle se admin login hai? (admin.html ton Google session vi chal sakda) */
    auth.onAuthStateChanged((user) => {
      if (user && user.email === ADMIN_EMAIL) {
        showResetForm(user.email);
      }
    });

    async function adminLogin() {
      const btn = document.getElementById("adminLoginBtn");
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value;
      if (!email || !pass) return showMsg("Email ਤੇ password ਭਰੋ", false);
      busy(btn, true);
      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        if (cred.user.email !== ADMIN_EMAIL) {
          await auth.signOut();
          showMsg("❌ ਇਹ Admin ਖਾਤਾ ਨਹੀਂ ਹੈ!", false);
          return;
        }
        showResetForm(cred.user.email);
      } catch (e) {
        showMsg("❌ Login fail: " + (e.code || e.message), false);
      } finally {
        busy(btn, false, "👑 Admin Login ਕਰੋ");
      }
    }

    function showResetForm(email) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("resetBox").classList.remove("hidden");
      document.getElementById("whoAmI").textContent = email;
      msgBox.className = "msg";
    }

    async function doReset() {
      const btn = document.getElementById("resetBtn");
      const phone = document.getElementById("stuPhone").value.trim();
      const newPass = document.getElementById("stuNewPass").value;

      if (!/^[6-9]\d{9}$/.test(phone)) return showMsg("ਗ਼ਲਤ mobile number — 10 ਅੰਕ ਦਾ ਸਹੀ ਨੰਬਰ ਲਿਖੋ", false);
      if (newPass.length < 6) return showMsg("ਨਵਾਂ password ਘੱਟੋ-ਘੱਟ 6 ਅੱਖਰਾਂ ਦਾ ਹੋਵੇ", false);

      busy(btn, true);
      try {
        const user = auth.currentUser;
        if (!user || user.email !== ADMIN_EMAIL) {
          return showMsg("Admin session ਖ਼ਤਮ — page reload karo", false);
        }
        const adminIdToken = await user.getIdToken();

        const r = await fetch("/api/admin-reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adminIdToken, phone, newPassword: newPass })
        });
        const d = await r.json();
        if (d.success) {
          showMsg("✅ ਹੋ ਗਿਆ! Student ਹੁਨ " + phone + " + ਨਵੇਂ password ਨਾਲ login ਕਰ ਸਕਦਾ ਹੈ। Password ਉਸਨੂੰ WhatsApp ਤੇ ਭੇਜ ਦਿਓ!", true);
        } else {
          showMsg("❌ " + (d.message || "Reset fail"), false);
        }
      } catch (e) {
        showMsg("❌ Server error: " + e.message, false);
      } finally {
        busy(btn, false, "🔄 Password Reset ਕਰੋ");
      }
    }
  </script>
</body>
</html>
